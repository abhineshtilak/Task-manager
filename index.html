<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#efe3c0">
  <title>TrailDay | Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sun" aria-hidden="true"></div>
  <div class="mountains" aria-hidden="true"><span></span><span></span><span></span></div>

  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="badge" aria-hidden="true">✦</div>
        <div>
          <p class="eyebrow">TRAILDAY / DAILY ROUTE</p>
          <h1>Task<span>Manager</span></h1>
          <p id="today" class="date"></p>
        </div>
      </div>
      <button id="clearCompleted" class="pill-btn" type="button">Clear done ↗</button>
    </header>

    <section class="hero-card">
      <div class="hero-copy">
        <p class="route-label">TODAY'S MISSION</p>
        <h2>Make the day <em>count.</em></h2>
        <p id="quote">Small moves. Big terrain. Keep going.</p>
      </div>
      <div class="rover" aria-hidden="true">
        <div class="rover-body"><span class="window"></span><span class="window small"></span></div>
        <div class="wheel left"></div><div class="wheel right"></div>
        <span class="flag">★</span>
      </div>
    </section>

    <section class="stats" aria-label="Task statistics">
      <div class="stat"><span id="totalCount">0</span><small>ON ROUTE</small></div>
      <div class="stat"><span id="activeCount">0</span><small>TO GO</small></div>
      <div class="stat"><span id="doneCount">0</span><small>DONE</small></div>
      <div class="progress-card">
        <div class="progress-label"><span>DAY COMPLETION</span><strong id="progressText">0%</strong></div>
        <div class="progress"><span id="progressBar"></span></div>
      </div>
    </section>

    <section class="composer">
      <div class="section-tag">+ NEW WAYPOINT</div>
      <form id="taskForm">
        <input id="taskInput" type="text" maxlength="120" autocomplete="off" placeholder="What's the next move?" required>
        <select id="priority" aria-label="Priority">
          <option value="medium">● Medium</option>
          <option value="high">▲ High</option>
          <option value="low">▼ Low</option>
        </select>
        <button class="add-btn" type="submit">Add waypoint</button>
      </form>
    </section>

    <nav class="filters" aria-label="Task filters">
      <button class="filter active" data-filter="all">All routes</button>
      <button class="filter" data-filter="active">Still ahead</button>
      <button class="filter" data-filter="completed">Completed</button>
    </nav>

    <section id="taskList" class="task-list" aria-live="polite"></section>
    <div id="emptyState" class="empty" hidden>
      <div class="empty-icon">⌁</div>
      <strong>Trail is clear.</strong>
      <span>Add a waypoint and start moving.</span>
    </div>

    <footer><span>LOCAL STORAGE • YOUR DATA STAYS IN THIS BROWSER</span><button id="resetAll" class="text-btn" type="button">Reset map</button></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
